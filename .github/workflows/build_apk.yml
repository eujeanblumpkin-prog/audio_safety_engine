name: Build Android Native Library

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK & cargo-ndk
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          cargo install cargo-ndk

      - name: Build Native Rust Library
        run: |
          export ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653
          cargo ndk -t arm64-v8a build --release

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaudio_safety_engine-arm64
          path: target/aarch64-linux-android/release/
