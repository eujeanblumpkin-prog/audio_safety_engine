name: Build Cross-Platform Native Libraries

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          cargo install cargo-ndk
          export ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653
          cargo ndk -t arm64-v8a build --release
      - uses: actions/upload-artifact@v4
        with:
          name: libaudio_safety_engine-android
          path: target/aarch64-linux-android/release/libaudio_safety_engine.so

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - run: |
          cargo build --target aarch64-apple-ios --release
          cargo build --target aarch64-apple-ios-sim --release
      - uses: actions/upload-artifact@v4
        with:
          name: libaudio_safety_engine-ios
          path: target/aarch64-apple-ios/release/libaudio_safety_engine.a
