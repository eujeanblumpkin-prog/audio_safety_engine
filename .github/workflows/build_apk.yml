name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android NDK
        uses: nsdkp/build-ndk-action@v1
        with:
          ndk-version: r25c

      - name: Build Native Rust Library
        run: cargo ndk -t arm64-v8a -o ./android/app/src/main/jniLibs build --release

      - name: Upload Native Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-rust-jni-libs
          path: ./android/app/src/main/jniLibs/
